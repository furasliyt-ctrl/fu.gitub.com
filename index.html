<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ممتحن" />
  <meta property="og:title" content="ممتحن - إعداد الأسئلة الامتحانية" />
  <meta property="og:description" content="منصة ممتحن لإعداد وتصميم وطباعة الأسئلة الامتحانية بسهولة واحترافية للمعلمين والأساتذة." />
  <meta property="og:url" content="https://furasliyt-ctrl.github.io/fu.gitub.com/" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts (Arabic & English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- docx.js for Real Word (.docx) Export (jsDelivr + unpkg fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/docx@8.5.0/build/index.umd.js';document.head.appendChild(s);"></script>

  <!-- html2pdf.js for Direct PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --theme-primary: #1e3a8a;
      --theme-primary-light: #eff6ff;
      --theme-border: #1e3a8a;
      --paper-font: 'Cairo', sans-serif;
      --paper-margin: 10mm;
      --paper-line-height: 1.45;
      --paper-scale: 1;
      --thin-bar-font: 13px;
      --thin-bar-py: 5px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* A4 Paper Simulation - Strict Single Page Fit */
    .a4-sheet {
      width: 210mm;
      height: 297mm;
      max-height: 297mm;
      background: #ffffff;
      box-shadow: 0 12px 35px -8px rgba(15, 23, 42, 0.14), 0 0 1px rgba(15, 23, 42, 0.2);
      margin: 0 auto;
      padding: var(--paper-margin);
      font-family: var(--paper-font);
      line-height: var(--paper-line-height);
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .a4-sheet.landscape {
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
    }

    /* Paper Borders */
    .paper-inner-frame {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .frame-simple {
      border: 2px solid var(--theme-border);
      padding: 6mm 8mm;
    }

    .frame-double {
      border: 4px double var(--theme-border);
      padding: 6mm 8mm;
    }

    .frame-ornate {
      border: 2px solid var(--theme-border);
      outline: 1px solid var(--theme-border);
      outline-offset: -5px;
      padding: 7mm 9mm;
    }

    /* Thin Top Rectangular Free-Edit Bar */
    .thin-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1.8px solid var(--theme-border);
      background-color: var(--theme-primary-light);
      border-radius: 6px;
      padding: var(--thin-bar-py) 12px;
      margin-bottom: 10px;
      font-size: var(--thin-bar-font);
      line-height: 1.35;
      position: relative;
      transition: all 0.15s ease;
    }

    .thin-header-free-text {
      flex: 1;
      min-height: 1.35em;
      font-weight: 800;
      color: #0f172a;
      cursor: text;
    }

    .thin-header-bar:hover .header-size-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .header-size-controls {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      shrink: 0;
    }

    /* Editable placeholders */
    [contenteditable="true"]:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      pointer-events: none;
      display: inline-block;
    }

    [contenteditable="true"]:focus {
      outline: 2px dashed rgba(59, 130, 246, 0.45);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Compact Question Block Styling to Fit More Questions */
    .question-block {
      position: relative;
      border-radius: 8px;
      padding: 4px 8px !important;
      margin-bottom: 2px !important;
      transition: box-shadow 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .question-block:hover .block-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .question-block.selected-block {
      box-shadow: 0 0 0 2px var(--theme-primary);
    }

    .question-block.dragging {
      opacity: 0.45;
      transform: scale(0.99);
    }

    .question-block.drag-over {
      border-top: 3px solid var(--theme-primary);
    }

    .block-controls {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    @media (max-width: 1024px) {
      .block-controls,
      .header-size-controls {
        opacity: 1;
        pointer-events: auto;
      }
    }

    /* Answer Lines */
    .answer-line-solid {
      border-bottom: 1.2px solid #64748b;
      height: 20px;
      width: 100%;
    }
    .answer-line-dotted {
      border-bottom: 1.2px dotted #64748b;
      height: 20px;
      width: 100%;
    }

    /* Tables inside questions */
    .exam-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
      margin-bottom: 4px;
    }
    .exam-table th, .exam-table td {
      border: 1.2px solid #475569;
      padding: 3px 8px;
      min-width: 50px;
    }
    .exam-table th {
      background-color: var(--theme-primary-light);
      color: var(--theme-primary);
      font-weight: 700;
    }

    /* Preview Mode */
    body.preview-mode .no-preview,
    body.preview-mode .block-controls,
    body.preview-mode .header-size-controls,
    body.preview-mode .add-between-btn {
      display: none !important;
    }
    body.preview-mode .question-block {
      box-shadow: none !important;
    }
    body.preview-mode [contenteditable="true"]:focus {
      outline: none !important;
    }

    /* Responsive Scaling for Mobile/Tablet A4 View */
    @media screen and (max-width: 840px) {
      .paper-viewport {
        overflow-x: auto;
        padding: 12px !important;
      }
      .a4-sheet {
        width: 100%;
        min-width: 340px;
        height: auto;
        max-height: none;
        padding: 12px;
      }
      .frame-simple, .frame-double, .frame-ornate {
        padding: 8px;
      }
    }

    /* Print Engine Rules - Force Single A4 Page */
    @media print {
      @page {
        size: A4;
        margin: 6mm;
      }
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print,
      .block-controls,
      .header-size-controls,
      .add-between-btn,
      #toast-container,
      #modal-backdrop {
        display: none !important;
      }
      .paper-viewport {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
        display: block !important;
      }
      .a4-sheet {
        width: 100% !important;
        height: 284mm !important;
        max-height: 284mm !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 4mm !important;
        overflow: hidden !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .question-block {
        box-shadow: none !important;
        border-color: transparent !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      [contenteditable="true"]:empty:before {
        content: "" !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none sm:select-auto">

  <!-- Top App Header (Navbar) -->
  <header class="no-print no-preview bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-[1600px] mx-auto px-3 sm:px-5 py-2 sm:h-16 flex flex-wrap items-center justify-between gap-2">
      
      <!-- Brand Logo & Title -->
      <div class="flex items-center gap-2.5 sm:gap-3">
        <button id="mobile-sidebar-toggle" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 border border-slate-200" title="القائمة والأدوات">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <div class="flex items-center gap-2.5">
          <div id="brand-badge" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center text-white shadow-sm transition-colors" style="background-color: var(--theme-primary);">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <path d="m9 15 2 2 4-4"></path>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900 leading-none">مُمْتَحِن</h1>
              <span class="hidden sm:inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">استوديو الامتحانات</span>
            </div>
            <p class="text-[11px] text-slate-500 hidden md:block mt-0.5">منصة إعداد وتنسيق وطباعة الأسئلة الامتحانية</p>
          </div>
        </div>

        <!-- Exam Title Input -->
        <div class="hidden xl:flex items-center mr-4 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 focus-within:border-blue-500 focus-within:bg-white transition">
          <i data-lucide="file-edit" class="w-4 h-4 text-slate-400 ml-2"></i>
          <input id="exam-doc-title" type="text" value="نموذج امتحان جديد" placeholder="اسم ملف الامتحان..." class="bg-transparent text-sm font-semibold text-slate-700 focus:outline-none w-48" />
          <span id="autosave-indicator" class="text-[11px] text-emerald-600 font-medium mr-2 flex items-center gap-1">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> محفوظ
          </span>
        </div>
      </div>

      <!-- Secondary Quick Tools (Undo, Saved Exams, Preview) -->
      <div class="flex items-center gap-1.5">
        <!-- Undo / Redo -->
        <div class="flex items-center bg-slate-100 rounded-xl p-1">
          <button onclick="undoAction()" class="p-1.5 rounded-lg text-slate-600 hover:bg-white hover:text-slate-900 transition" title="تراجع (Undo)">
            <i data-lucide="undo-2" class="w-4 h-4"></i>
          </button>
          <button onclick="redoAction()" class="p-1.5 rounded-lg text-slate-600 hover:bg-white hover:text-slate-900 transition" title="إعادة (Redo)">
            <i data-lucide="redo-2" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Saved Exams & Templates -->
        <button onclick="openExamsModal()" class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200/80 transition" title="الامتحانات المحفوظة والقوالب">
          <i data-lucide="folder-open" class="w-4 h-4 text-indigo-600"></i>
          <span class="hidden sm:inline">المكتبة والقوالب</span>
        </button>

        <!-- Preview Toggle -->
        <button onclick="togglePreviewMode()" class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold text-amber-800 bg-amber-50 hover:bg-amber-100 border border-amber-200 transition" title="معاينة الورقة كاملة">
          <i data-lucide="eye" class="w-4 h-4 text-amber-600"></i>
          <span class="hidden sm:inline">معاينة</span>
        </button>
      </div>
    </div>

    <!-- Dedicated Always-Visible Export, Save & Print Bar (Desktop & Mobile) -->
    <div class="bg-slate-900 text-white px-3 sm:px-5 py-2 border-t border-slate-800">
      <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <!-- Direct Word (.docx) Export Button -->
          <button id="export-main-btn" onclick="exportToDOCX()" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-blue-600 hover:bg-blue-500 text-white shadow-sm transition cursor-pointer" title="تنزيل ملف Word قابل للتعديل">
            <i data-lucide="file-text" class="w-4 h-4"></i>
            <span>تصدير Word</span>
          </button>

          <!-- Direct PDF Export Button -->
          <button onclick="exportToPDF()" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-rose-600 hover:bg-rose-500 text-white shadow-sm transition cursor-pointer" title="تنزيل ملف PDF في ورقة A4 واحدة">
            <i data-lucide="file-down" class="w-4 h-4"></i>
            <span>تصدير PDF</span>
          </button>

          <!-- Direct Print Button -->
          <button onclick="printExamDirect()" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-slate-700 hover:bg-slate-600 text-white border border-slate-600 transition cursor-pointer" title="طباعة مباشرة على ورق A4">
            <i data-lucide="printer" class="w-4 h-4"></i>
            <span>طباعة</span>
          </button>

          <!-- Save Exam Button -->
          <button onclick="saveCurrentExamPrompt()" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition cursor-pointer" title="حفظ الامتحان داخل المنصة">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span>حفظ الامتحان</span>
          </button>

          <!-- Auto-Fit to Single A4 Page Button -->
          <button onclick="autoFitSingleA4()" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm transition cursor-pointer" title="ضغط المحتوى تلقائياً ليتسع في ورقة A4 واحدة">
            <i data-lucide="minimize-2" class="w-4 h-4"></i>
            <span>ضبط بورقة A4 واحدة</span>
          </button>

          <!-- Copy All Questions Button -->
          <button onclick="copyAllQuestions()" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition cursor-pointer" title="نسخ جميع الأسئلة مع التنسيق">
            <i data-lucide="copy" class="w-4 h-4 text-sky-400"></i>
            <span>نسخ الأسئلة</span>
          </button>
        </div>

        <div class="hidden md:flex items-center gap-2 text-[11px] text-slate-300">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          <span>الحفظ التلقائي مفعّل • ورقة A4 واحدة مضغوطة</span>
        </div>
      </div>
    </div>

    <!-- Rich Text Formatting Toolbar -->
    <div class="bg-slate-50/90 border-t border-slate-200 px-3 py-1.5 overflow-x-auto">
      <div class="max-w-[1600px] mx-auto flex items-center gap-1.5 min-w-max">
        
        <!-- Font Family -->
        <select id="toolbar-font-family" onchange="applyFontFamily(this.value)" class="h-8 px-2.5 text-xs font-semibold bg-white border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:border-blue-500" title="نوع الخط">
          <option value="'Cairo', sans-serif">خط Cairo (كايرو)</option>
          <option value="'Tajawal', sans-serif">خط Tajawal (تجوال)</option>
          <option value="'Amiri', serif">خط Amiri (أميري - كلاسيكي)</option>
          <option value="'Noto Naskh Arabic', serif">خط Noto Naskh (نسخ)</option>
          <option value="'Readex Pro', sans-serif">خط Readex Pro</option>
          <option value="'IBM Plex Sans Arabic', sans-serif">خط IBM Plex Arabic</option>
          <option value="Arial, sans-serif">خط Arial</option>
          <option value="'Traditional Arabic', serif">خط Traditional Arabic</option>
        </select>

        <!-- Font Size -->
        <div class="flex items-center bg-white border border-slate-200 rounded-lg h-8 px-1" title="حجم خط الأسئلة">
          <button onclick="changeSelectedFontSize(-1)" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:bg-slate-100 rounded text-xs font-bold">-</button>
          <select id="toolbar-font-size" onchange="applyFontSize(this.value)" class="text-xs font-bold text-slate-700 bg-transparent px-1 focus:outline-none">
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13" selected>13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="22">22</option>
            <option value="24">24</option>
          </select>
          <button onclick="changeSelectedFontSize(1)" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:bg-slate-100 rounded text-xs font-bold">+</button>
        </div>

        <div class="h-5 w-[1px] bg-slate-300 mx-0.5"></div>

        <!-- Bold, Italic, Underline, Strike -->
        <button onmousedown="event.preventDefault(); execFormat('bold')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold text-sm" title="عريض (Bold)">B</button>
        <button onmousedown="event.preventDefault(); execFormat('italic')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700 italic font-serif text-sm" title="مائل (Italic)">I</button>
        <button onmousedown="event.preventDefault(); execFormat('underline')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700 underline text-sm" title="تحته خط (Underline)">U</button>
        <button onmousedown="event.preventDefault(); execFormat('strikeThrough')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700 line-through text-sm" title="يتوسطه خط">S</button>

        <div class="h-5 w-[1px] bg-slate-300 mx-0.5"></div>

        <!-- Text Color -->
        <label class="h-8 px-2 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center gap-1 cursor-pointer" title="لون النص المحدد">
          <span class="text-xs font-bold text-slate-700">A</span>
          <input type="color" value="#1e3a8a" onchange="execFormatColor('foreColor', this.value)" class="w-4 h-4 border-0 p-0 bg-transparent cursor-pointer" />
        </label>

        <!-- Text Highlight Color -->
        <label class="h-8 px-2 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center gap-1 cursor-pointer" title="تمييز الكلمات بلون">
          <i data-lucide="highlighter" class="w-3.5 h-3.5 text-amber-500"></i>
          <input type="color" value="#fef08a" onchange="execFormatColor('hiliteColor', this.value)" class="w-4 h-4 border-0 p-0 bg-transparent cursor-pointer" />
        </label>

        <!-- Question Card Background Color -->
        <label class="h-8 px-2 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center gap-1 cursor-pointer" title="تلوين خلفية السؤال المحدد">
          <i data-lucide="paint-bucket" class="w-3.5 h-3.5 text-indigo-600"></i>
          <input type="color" id="block-bg-picker" value="#f8fafc" onchange="applyBlockBackground(this.value)" class="w-4 h-4 border-0 p-0 bg-transparent cursor-pointer" />
        </label>

        <div class="h-5 w-[1px] bg-slate-300 mx-0.5"></div>

        <!-- Alignment -->
        <button onmousedown="event.preventDefault(); execFormat('justifyRight')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700" title="محاذاة لليمين">
          <i data-lucide="align-right" class="w-4 h-4"></i>
        </button>
        <button onmousedown="event.preventDefault(); execFormat('justifyCenter')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700" title="توسيط">
          <i data-lucide="align-center" class="w-4 h-4"></i>
        </button>
        <button onmousedown="event.preventDefault(); execFormat('justifyLeft')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700" title="محاذاة لليسار">
          <i data-lucide="align-left" class="w-4 h-4"></i>
        </button>

        <!-- Direction RTL / LTR -->
        <button onclick="toggleSelectedDirection()" class="h-8 px-2 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center gap-1 text-xs font-bold text-slate-700" title="تبديل اتجاه الفقرة عربي / إنجليزي (RTL/LTR)">
          <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
          <span>RTL/LTR</span>
        </button>

        <div class="h-5 w-[1px] bg-slate-300 mx-0.5"></div>

        <!-- Line Height -->
        <select id="toolbar-line-height" onchange="updatePaperLineHeight(this.value)" class="h-8 px-2 text-xs font-semibold bg-white border border-slate-200 rounded-lg text-slate-700" title="تباعد الأسطر">
          <option value="1.25">تباعد 1.25 (مضغوط)</option>
          <option value="1.35">تباعد 1.35</option>
          <option value="1.45" selected>تباعد 1.45</option>
          <option value="1.6">تباعد 1.6</option>
          <option value="1.75">تباعد 1.75</option>
          <option value="2.0">تباعد 2.0</option>
        </select>

        <!-- Math Symbols Popover Trigger -->
        <button onclick="toggleMathPanel()" class="h-8 px-2.5 rounded-lg bg-white border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 flex items-center gap-1 text-xs font-bold text-indigo-700" title="إدراج رموز رياضية ومعادلات">
          <span>∑</span>
          <span>رموز</span>
        </button>

        <!-- Insert Blank Space -->
        <button onmousedown="event.preventDefault(); insertInlineBlank()" class="h-8 px-2.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center gap-1 text-xs font-semibold text-slate-700" title="إدراج فراغ منقط داخل النص">
          <span>[......]</span>
          <span>فراغ</span>
        </button>

        <!-- Convert Digits Arabic <-> English -->
        <button onclick="toggleDigitSystem()" id="digit-toggle-btn" class="h-8 px-2.5 rounded-lg bg-white border border-slate-200 hover:bg-emerald-50 hover:border-emerald-300 flex items-center gap-1 text-xs font-bold text-emerald-700" title="تحويل الأرقام بين العربية (١٢٣) والإنجليزية (123)">
          <i data-lucide="hash" class="w-3.5 h-3.5"></i>
          <span id="digit-mode-label">أرقام: ١٢٣</span>
        </button>
      </div>
    </div>

    <!-- Math & Special Symbols Drawer -->

      <div class="max-w-[1600px] mx-auto flex flex-wrap items-center gap-1.5">

      </div>
    </div>
